<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Body Comp</title>
    <link rel="icon" href="icon-192.png">
    <!-- The app lives in app/. It moved there so Chrome on Android would treat

         old scope that no change of manifest id or start_url would clear. -->

    <script>location.replace('app/');</script>
</head>
<body>
    <p><a href="app/">Body Comp has moved here.</a></p>
</body>
